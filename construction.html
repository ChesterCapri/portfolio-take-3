<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Construction — Joseph D. Nemani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Jost:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #F2E7D3;
    --cream: #FBF6EA;
    --ink: #2B2420;
    --ink-soft: #5A4E42;
    --oxblood: #7A2E2E;
    --mustard: #D9A441;
    --line: rgba(43,36,32,0.28);

    --serif: "Fraunces", Georgia, serif;
    --sans: "Jost", "Century Gothic", Futura, sans-serif;
    --mono: "Space Mono", "Courier New", monospace;
  }
  *,*::before,*::after{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--sans);
    text-align: center;
    padding: 24px;
  }
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(rgba(43,36,32,0.035) 1px, transparent 1px),
      radial-gradient(rgba(43,36,32,0.025) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 2px 2px;
  }

  .tape-frame{
    position: relative;
    max-width: 640px;
    width: 100%;
    padding: 10px;
    background: repeating-linear-gradient(
      -45deg,
      var(--mustard), var(--mustard) 22px,
      var(--ink) 22px, var(--ink) 44px
    );
    background-size: 200% 200%;
    animation: shift 14s linear infinite;
    box-shadow: 0 18px 40px rgba(43,36,32,0.25);
  }
  @keyframes shift{
    from{ background-position: 0 0; }
    to{ background-position: 300px 0; }
  }

  .panel{
    position: relative;
    background: var(--cream);
    padding: clamp(40px, 8vw, 72px) clamp(24px, 6vw, 56px);
  }

  .cone{
    width: 64px;
    height: 64px;
    margin: 0 auto 26px;
    color: var(--oxblood);
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--oxblood);
    margin-bottom: 14px;
  }

  h1{
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin: 0 0 20px;
  }

  p.sub{
    font-size: 1.05rem;
    color: var(--ink-soft);
    max-width: 420px;
    margin: 0 auto 34px;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    background: var(--mustard);
    color: var(--ink);
    text-decoration: none;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease;
  }
  .btn:hover{
    transform: translateY(-3px);
    box-shadow: 4px 5px 0 var(--ink);
  }

  .stamp{
    margin-top: 30px;
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  @media (prefers-reduced-motion: reduce){
    .tape-frame{ animation: none; }
  }
</style>
</head>
<body>

  <div class="tape-frame">
    <div class="panel">
      <svg class="cone" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 14 L74 78 H26 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
        <path d="M38 50 H62" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M20 78 H80" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <div class="eyebrow">Pardon the Dust</div>
      <h1>In Construction</h1>
      <p class="sub">We'll let you know when we have this puppy up and running.</p>

      <a class="btn" href="index.html#projects">← Back to Portfolio</a>

      <div class="stamp">Status: Actively Being Built, Not Abandoned</div>
    </div>
  </div>

</body>
</html>
